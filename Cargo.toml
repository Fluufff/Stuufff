[package]
name = "logistics-inventory"
version = "0.1.0"
edition = "2024"

[dependencies]
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
tokio = { version = "1.52.3", features = ["full"] }
rustls = { version = "0.23.40", features = ["aws-lc-rs","logging","tls12","ring"], default-features = false }
clap = { version = "4.6.1", features = ["derive", "string"] }
chrono = { version = "0.4.43", features = ["serde"]}
duration-str = "0.21.0"
shadow-rs = { version = "2.0.0", features = ["metadata"] }
thiserror = "2.0.18"
diesel = { version = "2.3.9", features = ["postgres", "serde_json", "time", "r2d2", "chrono", "uuid"] }
diesel_migrations = "2.3.2"
r2d2 = "0.8.10"
serde = { version = "1.0.218", features = ["derive"] }
serde_yaml = "0.9.34"
serde_json = { version = "1.0.140", features = ["arbitrary_precision"] }
minijinja = { version = "2.19.0", features = ["loader"] }
futures = "0.3.31"
base64 = "0.22.1"
tower-http = { version = "0.6.10", features = ["cors"] }
http = "1.4.0"
axum = "0.8.9"
mime_guess = "2.0.5"
axum-swagger-ui = "0.3.0"
tower = { version = "0.5.2", features = [] }
rust-embed = { version = "8.5.0", features = ["interpolate-folder-path", "compression"] }
reqwest = { version = "0.13.3", features = ["blocking", "rustls", "charset", "http2", "json", "form", "query"], default-features = false }
serde_urlencoded = "0.7.1"
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
rand = "0.10.1"
yup-oauth2 = { version = "12.1.2", features = ["service_account"] }
serde_with = "3.21.0"
strum_macros = "0.28.0"
tokio-util = "0.7.18"
uuid = { version = "1.23.4", features = ["serde", "v7"] }

[build-dependencies]
shadow-rs = { version = "2.0.0", features = ["metadata"] }
